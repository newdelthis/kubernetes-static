apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdac-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cdac-web
  template:
    metadata:
      labels:
        app: cdac-web
    spec:
      containers:
        - name: web
          image: newdelthis/cdac-web:v1
          imagePullPolicy: Always        # pull from Docker Hub
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cdac-web
spec:
  type: NodePort
  selector:
    app: cdac-web
  ports:
    - port: 80          # service port inside the cluster
      targetPort: 80    # container port
      nodePort: 30080   # port opened on the minikube node
